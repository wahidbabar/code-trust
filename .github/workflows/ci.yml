name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Corepack reads the pnpm version from packageManager in package.json. It has to be on PATH
      # before setup-node, which asks pnpm where its store is in order to cache it.
      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      # Needs no AWS credentials and no ALERT_EMAIL: the script synthesizes with a placeholder address.
      - run: pnpm synth
